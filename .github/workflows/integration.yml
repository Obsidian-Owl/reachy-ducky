name: Integration tests (live Claude)

# Live-Claude tests are expensive and slow. Run them on demand (PR with
# `integration` label), on a weekly cron, or manually via workflow_dispatch.
# Authenticated via the CLAUDE_CODE_OAUTH_TOKEN secret (Claude Code GitHub
# App, set up in the Obsidian-Owl org).

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-claude:
    name: Live Claude integration tests
    if: github.event_name != 'pull_request' || github.event.label.name == 'integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.30"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node (for MCP server processes)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: uv sync --all-packages --group dev

      - name: Run integration tests
        env:
          REACHY_DUCKY_RUN_INTEGRATION: "1"
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run pytest -q -m integration
