name: SDK contract tests

# Catch reachy-mini SDK renames before they hit real hardware. The
# MotionDriver silences mypy on six SDK calls (issue #18); the unit
# tier uses MockMotionDriver and stays green through any rename.
# These tests load the real ``ReachyMini`` class and introspect the
# attribute table — no daemon, no MuJoCo, no GStreamer, no media
# init. Cheap, fast, catches the thing we actually care about.
#
# For history / context on why we don't run a full sim daemon in CI,
# see commits 12979ea..4c937af on the cleanup/sim-tests branch —
# getting reachy-mini-daemon --sim to boot cleanly on ubuntu-latest
# turned out to cost more than the behaviour test yielded.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token; this job only checks out + tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-contract:
    name: Reachy-mini SDK contract (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Build-time headers for pygobject/pycairo, transitive deps of
      # reachy-mini. Even though we never call media/GI at runtime in
      # this test, the package still needs to INSTALL — pycairo 1.29
      # builds from source and needs these. Other GStreamer typelibs
      # and MuJoCo render deps are NOT needed: we don't construct
      # ReachyMini(), we only introspect its class.
      - name: Install pygobject/pycairo build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            libglib2.0-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.30"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # ``--extra robot`` brings in reachy-mini via app/pyproject.toml.
      # We deliberately skip the ``[mujoco]`` extra — the sim backend
      # isn't exercised by class-surface introspection.
      - name: Install workspace with robot extra
        run: uv sync --all-packages --group dev --extra robot

      - name: Run SDK contract tests
        run: uv run pytest -m sdk -q
