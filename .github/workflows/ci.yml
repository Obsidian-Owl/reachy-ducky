name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint, type-check, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.30"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pygobject/pycairo build headers (Linux only)
        if: runner.os == 'Linux'
        # Build-time headers for pygobject/pycairo, transitive deps of
        # reachy-mini (now a plain base dep via app/pyproject.toml). Even
        # though we never call media/GI at runtime in the default test
        # tier, pycairo 1.29 still builds from source on install and
        # needs these. macOS runners get pycairo wheels — no apt step
        # needed there.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            libglib2.0-dev

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        # --group dev installs workspace-wide dev tools (pytest, ruff, mypy,
        # bandit, pytest-asyncio, pytest-httpx). reachy-mini is a plain
        # base dep and installs cross-platform (the upstream
        # gstreamer-msvc-runtime platform-marker bug is patched via
        # [tool.uv] dependency-metadata in pyproject.toml). We do NOT use
        # --all-extras because the menubar's `macos` extra pulls rumps
        # which is macOS-only.
        run: uv sync --all-packages --group dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        # On macOS we additionally pull the menubar's `macos` extra so the
        # real rumps import path is exercised (catches regressions in the
        # lazy-import contract that a fake-rumps unit test can't see).
        run: uv sync --all-packages --group dev --extra macos

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        # Same pattern as Linux: no `macos` extra (rumps is macOS-only).
        # menubar's *tests* are skipped on Windows via
        # `menubar/tests/conftest.py`'s ``pytest.importorskip("rumps")``;
        # menubar's base deps install fine cross-platform.
        run: uv sync --all-packages --group dev

      - name: Install gitleaks (Linux)
        # The daemon's specialists pipe every prompt through ``gitleaks stdin``
        # before ``brain.query()`` (pre-brain secret redaction, design doc §10 /
        # closed issue #50). Specialist tests that go through ``review()``
        # exercise the real redact path; without the binary they'd fail
        # closed with a ``redaction-failed`` flag. Version pinned for
        # reproducibility; bump intentionally via a separate commit.
        #
        # Bumped from 8.21.2 → 8.30.1 after the first CI run of PR #52 showed
        # the older Linux binary returning empty stdout with ``--report-path -``
        # for the ``stdin`` subcommand — behavior fixed in a later release.
        if: runner.os == 'Linux'
        run: |
          VERSION=8.30.1
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install gitleaks (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gitleaks
          gitleaks version

      - name: Install gitleaks (Windows)
        if: runner.os == 'Windows'
        # Mirror the Linux tarball install — gitleaks ships Windows
        # binaries on the same release page. Pinned for reproducibility;
        # bump intentionally via a separate commit. Match the version
        # used in the Linux step.
        shell: bash
        run: |
          VERSION=8.30.1
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_windows_x64.zip" \
            -o gitleaks.zip
          unzip -o gitleaks.zip -d "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks.exe" version

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Mypy (strict) — src
        run: uv run mypy --strict daemon/src app/src menubar/src protocol/src

      - name: Mypy (strict) — tests
        # Tests are production-grade per .claude/rules/testing-standards.md.
        # Keep in lockstep with the lefthook pre-push ``mypy-full`` target so
        # a test that fails locally can never slip through CI.
        run: uv run mypy --strict daemon/tests protocol/tests menubar/tests app/tests

      - name: Bandit (security)
        run: uv run bandit -ll -r daemon/src app/src menubar/src protocol/src

      - name: Pytest (unit tier) with coverage (Linux + macOS)
        if: runner.os != 'Windows'
        # Coverage floor + report formats: `term-missing` for the job log;
        # `xml` for future upload to Codecov / artifact inspection. The
        # `fail_under` threshold lives in pyproject.toml's
        # [tool.coverage.report] so the same floor applies locally.
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Pytest (unit tier) with coverage (Windows — informational only)
        if: runner.os == 'Windows'
        # Windows is the informational tier of the CI matrix per Phase 3 of
        # the canonical-dep-migration plan: it catches install-story breaks
        # but coverage gating lives on Linux + macOS where the menubar tests
        # (skipped on Windows because rumps is macOS-only) actually run.
        # ``--cov-fail-under=0`` overrides the pyproject.toml threshold.
        run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=0
        env:
          PYTHONDONTWRITEBYTECODE: "1"
