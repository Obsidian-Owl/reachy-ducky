[tool.uv.workspace]
members = ["daemon", "app", "menubar", "protocol"]

# PEP 735 dependency groups — workspace-wide dev tools. Subpackages no longer
# each carry their own `[project.optional-dependencies].dev`. Install with:
#   uv sync --all-packages --group dev
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.26",
    "pytest-httpx>=0.30,<0.35",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<0.8",
    "mypy>=1.11,<1.15",
    "bandit>=1.7,<1.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["daemon/tests", "app/tests", "menubar/tests", "protocol/tests"]
asyncio_mode = "auto"
# Deselect tiers that need external setup by default. Opt in via
# `-m <marker>`. Markers are declared below.
addopts = "-m 'not sim and not sdk'"
markers = [
    "hardware: requires Reachy Mini hardware",
    "integration: requires live external APIs",
    "sim: requires a running reachy-mini-daemon --sim (pytest -m sim)",
    "sdk: requires the reachy-mini SDK installed (no daemon); catches upstream API drift",
]

# Mypy per-module overrides. Keep this list short — one-liners for deps
# that ship no stubs OR that only install with an optional extra.
#   rumps: macOS-only menu-bar lib, no stubs / py.typed. Used only from
#          menubar.main via a lazy import behind `sys.platform == "darwin"`.
#   mediapipe: face-detection backend used by app.embodiment.gaze; the
#          upstream wheel ships no stubs / py.typed marker. The heavy
#          import is deferred into gaze_loop (hardware-tier only), but
#          mypy still needs this entry to resolve the module reference.
#   reachy_mini: robot SDK, only installed under `--extra robot`. Present
#          in CI for the sdk-contract job (app/tests/test_reachy_sdk_contract.py);
#          absent in a default dev venv. Matches the inline pyright
#          ignore on the same import.
[[tool.mypy.overrides]]
module = "rumps"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mediapipe"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reachy_mini"
ignore_missing_imports = true

# Pyright config lives in ./pyrightconfig.json (takes precedence over
# [tool.pyright] here; pyrightconfig.json is more reliably live-reloaded
# by IDE language servers). Pyright doesn't support per-module
# ignore_missing_imports like mypy; the inline `# pyright: ignore[...]`
# comments at each optional-dep import site serve the same purpose —
# grep for `reportMissingImports` to find them.

[tool.coverage.run]
# Coverage tracks only the shipped source trees — tests themselves
# execute to completion by definition and inflate the numerator. The
# four subpackages' src/ dirs are the units we actually ship.
source = ["daemon/src", "app/src", "menubar/src", "protocol/src"]
branch = true
relative_files = true

[tool.coverage.report]
# Threshold locks the current baseline (91% at the time this landed)
# with a small buffer for measurement variance and import-time
# branching we can't stably exercise. Bump when we're consistently
# >93% so regressions are caught before they widen.
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    # Pure typing imports never run.
    "if TYPE_CHECKING:",
    # ABCs by contract.
    "raise NotImplementedError",
    # Programmatic opt-outs for genuinely unreachable or
    # platform-specific branches — grep these to audit.
    "pragma: no cover",
    # CLI entry points covered by integration/hardware tiers, not unit.
    "if __name__ == .__main__.:",
]
