[project]
name = "reachy-ducky-app"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "reachy-ducky-protocol",
    "fastrtc>=0.0.20,<0.2",
    "onnxruntime>=1.18.0",
    "openai>=1.50,<2",
    "openwakeword>=0.6.0",
    "mediapipe>=0.10,<0.12",
    "httpx>=0.27,<0.29",
    "numpy>=1.26,<3",
    # reachy-mini is a plain base dep — installs cross-platform. The
    # gstreamer-msvc-runtime platform-marker bug is patched at the
    # workspace root via ``[tool.uv] dependency-metadata`` (mirrors
    # pollen-robotics/reachy_mini_conversation_app).
    "reachy-mini>=1.6.4,<2",
]

[project.scripts]
reachy-ducky-app-live = "reachy_ducky_app.main:live_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_ducky_app"]

[tool.uv.sources]
reachy-ducky-protocol = { workspace = true }
