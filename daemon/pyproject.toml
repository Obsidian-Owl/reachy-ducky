[project]
name = "reachy-ducky-daemon"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "reachy-ducky-protocol",
    "claude-agent-sdk>=0.1.60,<0.2",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<0.29",
]

[project.scripts]
reachy-ducky-daemon = "reachy_ducky_daemon.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_ducky_daemon"]

[tool.uv.sources]
reachy-ducky-protocol = { workspace = true }
